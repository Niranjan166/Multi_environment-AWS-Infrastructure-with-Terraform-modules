name: Terraform Staging

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging
    
jobs:
  terraform:
    name: Terraform Staging Pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./environments/staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file=staging.tfvars
        env:
          TF_VAR_db_password: ${{ secrets.STAGING_DB_PASSWORD }}
          TF_VAR_alert_email: ${{ secrets.STAGING_ALERT_EMAIL }}

      - name: Terraform Apply
        if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
        run: terraform apply -auto-approve -var-file=staging.tfvars
        env:
          TF_VAR_db_password: ${{ secrets.STAGING_DB_PASSWORD }}